name: update-catalog

# อัปเดต apps.json ให้ชี้เวอร์ชันล่าสุดเอง แล้ว commit กลับ repo
# รถดึง apps.json ผ่าน jsDelivr -> เห็นของใหม่เองโดยไม่ต้อง build APK ใหม่

on:
  schedule:
    - cron: "0 20 * * *"      # 20:00 UTC = ตี 3 เวลาไทย ทุกวัน
  workflow_dispatch:           # กดรันเองได้จากแท็บ Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: เช็คเวอร์ชันล่าสุดจากแหล่งทางการ
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # กัน rate limit ของ GitHub API
        run: |
          set +e
          python tools/update-catalog.py apps.json
          code=$?
          set -e
          if [ "$code" = "10" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" = "0" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "สคริปต์พัง (exit $code)"
            exit "$code"
          fi

      - name: commit
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps.json
          git commit -m "apps.json: อัปเดตเป็นเวอร์ชันล่าสุดอัตโนมัติ"
          git push

      # jsDelivr แคช @main ไว้ ~12 ชม. ไม่ purge รถจะยังเห็นของเก่าจนกว่าแคชหมดอายุ
      - name: purge แคช jsDelivr
        if: steps.check.outputs.changed == 'true'
        continue-on-error: true
        run: |
          curl -sS "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/apps.json" || true
